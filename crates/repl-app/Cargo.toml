[package]
name = "repl-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
env_logger.workspace = true
image.workspace = true
log.workspace = true
repl-capture.workspace = true
repl-core.workspace = true
repl-frames.workspace = true
repl-input.workspace = true
repl-vision.workspace = true
raw-window-handle.workspace = true
serde = { workspace = true }
serde_json.workspace = true
slint.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
repl-frames = { workspace = true, features = ["test-util"] }
# 界面行为测试用的无窗口后端：真实创建 MainWindow、点击按钮、输入文字。
# 它是 Slint 的内部 crate，不遵守 semver，版本必须与 Cargo.lock 里的 slint 完全一致；
# 升级 slint 时要同步改这里。
i-slint-backend-testing = "=1.17.1"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
